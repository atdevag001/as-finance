name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://asfinance:asfinance_dev@localhost:5432/asfinance_lms?schema=public
  JWT_SECRET: e2e-test-secret-minimum-16-chars
  # 120m so the JWT outlasts the full Playwright suite — at 15m the last
  # tests in a ~45-min run got 401'd mid-flow and redirected to /login,
  # producing false RBAC-matrix and rbac-matrix-style failures.
  JWT_EXPIRY: 120m
  SKIP_TOKEN_ROTATION: 'true'
  # Bypass KYC for seeded test customers; the audit's KYC enforcement is the
  # right behavior in prod but our seed customers have no uploaded docs.
  SKIP_KYC_CHECK: 'true'
  NODE_ENV: test

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: asfinance
          POSTGRES_PASSWORD: asfinance_dev
          POSTGRES_DB: asfinance_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: |
          pnpm --filter @as-finance/shared build
          pnpm --filter @as-finance/api build

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start API server
        run: |
          cd apps/api
          node dist/main.js &
          sleep 10
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3001/health/live

      - name: Start Web server
        run: |
          cd apps/web
          pnpm dev &
          sleep 30
          curl --retry 20 --retry-delay 3 --retry-connrefused http://localhost:3000

      - name: Run E2E tests
        run: pnpm --filter @as-finance/web test:e2e --project=unauthenticated --project=desktop-chrome
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/test/test-results/
          retention-days: 7

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos
          path: apps/web/test/test-results/**/*.webm
          retention-days: 7
