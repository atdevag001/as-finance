name: Autonomous Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      coverage_target:
        description: 'Coverage target percentage'
        required: false
        default: '80'
      run_flakiness_check:
        description: 'Run flakiness detection (5 runs)'
        required: false
        default: 'false'

env:
  DATABASE_URL: postgresql://asfinance:asfinance_dev@localhost:5432/asfinance_lms?schema=public
  JWT_SECRET: e2e-test-secret-minimum-16-chars
  JWT_EXPIRY: 15m
  NODE_ENV: test
  COVERAGE_TARGET: ${{ github.event.inputs.coverage_target || '80' }}

jobs:
  # Job 1: Unit Tests with Coverage
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: asfinance
          POSTGRES_PASSWORD: asfinance_dev
          POSTGRES_DB: asfinance_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests with coverage
        run: pnpm --filter @as-finance/api test:unit --coverage --reporter=json --outputFile=coverage/unit-results.json
        continue-on-error: true

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: apps/api/coverage/

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat apps/api/coverage/coverage-summary.json 2>/dev/null | jq -r '.total.lines.pct // 0')
          echo "Unit test line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $COVERAGE_TARGET" | bc -l) )); then
            echo "::warning::Coverage ($COVERAGE%) is below target ($COVERAGE_TARGET%)"
          fi

  # Job 2: E2E Tests - Sharded
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: asfinance
          POSTGRES_PASSWORD: asfinance_dev
          POSTGRES_DB: asfinance_lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: |
          pnpm --filter @as-finance/shared build
          pnpm --filter @as-finance/api build

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start servers
        run: |
          cd apps/api && node dist/main.js &
          cd apps/web && pnpm dev &
          sleep 30
          curl --retry 20 --retry-delay 3 --retry-connrefused http://localhost:3001/health/live
          curl --retry 20 --retry-delay 3 --retry-connrefused http://localhost:3000

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: |
          cd apps/web/test
          npx playwright test --project=desktop-chrome --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload shard results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: apps/web/test/blob-report/
          retention-days: 7

  # Job 3: Merge E2E Results
  merge-e2e-results:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: all-shards/

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter html ./all-shards
        continue-on-error: true

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-merged
          path: playwright-report/
          retention-days: 14

  # Job 4: Flakiness Detection (optional)
  flakiness-check:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_flakiness_check == 'true'
    needs: e2e-tests
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: asfinance
          POSTGRES_PASSWORD: asfinance_dev
          POSTGRES_DB: asfinance_lms
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - run: pnpm install

      - name: Build and setup
        run: |
          pnpm --filter @as-finance/shared build
          pnpm --filter @as-finance/api build
          pnpm db:migrate
          pnpm db:seed

      - name: Start servers
        run: |
          cd apps/api && node dist/main.js &
          cd apps/web && pnpm dev &
          sleep 30

      - name: Run flakiness detection (5 runs)
        run: |
          mkdir -p test-results/flakiness
          for i in {1..5}; do
            echo "=== Run $i ===" >> test-results/flakiness/summary.txt
            cd apps/web/test
            npx playwright test --project=desktop-chrome --reporter=json 2>&1 >> ../../../test-results/flakiness/run-$i.json || true
            cd ../../..
          done

      - name: Analyze flakiness
        run: |
          echo "Analyzing test flakiness..."
          # Parse results and identify flaky tests
          python3 -c "
          import json
          import os
          from collections import defaultdict

          results = defaultdict(lambda: {'pass': 0, 'fail': 0})

          for i in range(1, 6):
              try:
                  with open(f'test-results/flakiness/run-{i}.json') as f:
                      data = json.load(f)
                      for suite in data.get('suites', []):
                          for spec in suite.get('specs', []):
                              name = spec.get('title', 'unknown')
                              status = spec.get('ok', False)
                              if status:
                                  results[name]['pass'] += 1
                              else:
                                  results[name]['fail'] += 1
              except:
                  pass

          flaky = []
          for test, counts in results.items():
              total = counts['pass'] + counts['fail']
              if total > 0:
                  rate = counts['pass'] * 100 // total
                  if 0 < rate < 100:
                      flaky.append((test, rate))

          if flaky:
              print('FLAKY TESTS DETECTED:')
              for test, rate in sorted(flaky, key=lambda x: x[1]):
                  print(f'  {rate}% pass rate: {test}')
          else:
              print('No flaky tests detected')
          " || echo "Flakiness analysis skipped"

      - name: Upload flakiness report
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-report
          path: test-results/flakiness/

  # Job 5: Coverage Analysis
  coverage-analysis:
    runs-on: ubuntu-latest
    needs: [unit-tests, merge-e2e-results]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit/

      - name: Calculate coverage metrics
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Unit test coverage
          if [ -f coverage/unit/coverage-summary.json ]; then
            LINES=$(cat coverage/unit/coverage-summary.json | jq -r '.total.lines.pct')
            BRANCHES=$(cat coverage/unit/coverage-summary.json | jq -r '.total.branches.pct')
            FUNCTIONS=$(cat coverage/unit/coverage-summary.json | jq -r '.total.functions.pct')

            echo "### Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | $LINES% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | $BRANCHES% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | $FUNCTIONS% |" >> $GITHUB_STEP_SUMMARY
          fi

          # E2E coverage (page count)
          TOTAL_PAGES=$(find apps/web/src/app -name "page.tsx" | wc -l)
          E2E_SPECS=$(ls apps/web/test/e2e/*.playwright.spec.ts apps/web/test/e2e/*.spec.ts 2>/dev/null | wc -l || echo "0")
          E2E_COVERAGE=$((E2E_SPECS * 100 / TOTAL_PAGES))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pages | $TOTAL_PAGES |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Specs | $E2E_SPECS |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $E2E_COVERAGE% |" >> $GITHUB_STEP_SUMMARY

      - name: Coverage gate
        run: |
          # Fail if coverage is below threshold
          E2E_SPECS=$(ls apps/web/test/e2e/*.playwright.spec.ts apps/web/test/e2e/*.spec.ts 2>/dev/null | wc -l || echo "0")
          TOTAL_PAGES=$(find apps/web/src/app -name "page.tsx" | wc -l)
          E2E_COVERAGE=$((E2E_SPECS * 100 / TOTAL_PAGES))

          if [ "$E2E_COVERAGE" -lt "$COVERAGE_TARGET" ]; then
            echo "::error::E2E coverage ($E2E_COVERAGE%) is below target ($COVERAGE_TARGET%)"
            # Don't fail the build, just warn
          fi

  # Job 6: Notify on Failure
  notify:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, coverage-analysis]
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI Failure: ${context.workflow} - ${context.sha.slice(0, 7)}`;
            const body = `
            ## CI Pipeline Failed

            **Workflow:** ${context.workflow}
            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Commit:** ${context.sha}
            **Branch:** ${context.ref}

            Please investigate the failing tests.
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });

            const existingIssue = issues.data.find(i => i.title.includes(context.sha.slice(0, 7)));
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure', 'automated']
              });
            }
